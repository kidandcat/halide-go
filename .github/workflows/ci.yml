name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Test
        run: CGO_ENABLED=0 go test ./...
      - name: Test with wasm as the default backend
        run: CGO_ENABLED=0 go test -tags halidewasm ./...
      - name: Benchmarks
        run: CGO_ENABLED=0 go test -bench 'BenchmarkBlur' -benchtime 200ms -count 1 ./filters/

  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Halide
        run: python -m pip install --upgrade halide
      - name: Generator tests
        run: CGO_ENABLED=0 go test ./cmd/halide-gen/ -count=1
